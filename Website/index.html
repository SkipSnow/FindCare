<!-- Copyright (c) 2026 ChatHealthy.ai LLC. All rights reserved.
     Licensed under the FindCare Evaluation License (FEL-1.0).

     ChatHealthy.ai client shell.

     Per brain/BusinessArtifacts/architecture/FrontEnd/FrontEndArchitecture.pptx:
       - index.html is a lightweight container; ALL display logic lives in React.
       - React streams content to the seven named frames via ClientRouter.render.
       - Every server-bound action routes through ClientRouter.getStreamedPayloads
         (streaming) or ClientRouter.getFullPayload (single JSON) → /gate.
     The seven frame ids below — frame_Header, frame_Footer, frame_LeftPanel,
     frame_RightPanel, frame_UserMessage, frame_UserPromptAndControl,
     frame_MainWindow — are the architectural spine and MUST NOT change.

     Beside them sit four windows: frame_AboutChatHealtyPopUP,
     frame_SessionInfoPopUp, frame_MobileNavDrawer and frame_LegalPanel.
     A window is a different kind of frame from the seven, and these are
     declared here rather than built at runtime because ClientRouter used to
     manufacture them, which is display authored outside React. A window
     holding nothing is hidden by CSS, so opening one is rendering content
     into it and closing one is rendering none; nothing toggles anything.

     There is no nesting limit: one window opens another (About offers
     Session Info) and both stay open, so every window has its own declared
     place and all four are legible at once.

     Layout proportions ported verbatim from production: body flex-column with
     header (6%), main (flex:1), footer (4%); inside main, chat-label + a
     content-row carrying side-panel (20%) + center-column (flex:1) + side-panel
     (20%). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatHealthy.ai</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- CH_FONTS -->
  <style>
    :root {
      --teal:    #0b7a75;
      --border:  #d8e2e1;
      --surface: #ffffff;
      --bg:      #f5f5f4;
      --ink:     #1f2937;
      --max-w:   1200px;
      --radius:  0.5em;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      color: var(--ink); background: var(--bg); overflow: hidden;
    }
    /* font-size discipline: the root font size is set by the inlined
       CH_FONTS snippet (canonical). Body inherits 1rem; widgets MUST use
       font-size: 1em. Browser-default heading multipliers (h1=2em, h2=1.5em
       etc.) are the only larger sizes allowed. */
    body {
      display: flex; flex-direction: column;
    }
    header#frame_Header {
      position: sticky; top: 0; height: 6%;
      background: var(--surface);
      border-bottom: 0.125em solid var(--border);
      flex: 0 0 auto;
    }
    main {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      max-width: var(--max-w); width: 100%;
      margin: 0 auto; padding: 1em; gap: 1em;
      box-sizing: border-box;
    }
    .chat-label {
      font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--teal);
    }
    .content-row {
      flex: 1; min-height: 0;
      display: flex;
    }
    aside.side-panel {
      width: 20%; height: 100%; overflow: auto;
    }
    #frame_LeftPanel  { background: rgb(225,225,255); border-right: 0.125em solid var(--border); }
    #frame_RightPanel { background: var(--bg);       border-left:  0.125em solid var(--border); }
    .center-column {
      flex: 1; min-width: 0; height: 100%;
      display: flex; flex-direction: column;
    }
    #frame_MainWindow {
      flex: 1; min-height: 0; overflow: auto;
      background: var(--surface);
    }
    /* A phone is a window onto the arrangement, and the strip is only as
       wide as there is something to see. Each panel that holds anything is
       one screen wide, so the row is one screen when only the list exists,
       two once a specialty filter has been offered, three once a detail has
       been opened. A panel showing nothing takes no width at all, so a
       person can never slide onto a blank screen. Whether a panel shows
       anything is marked by the wrapper as ch-blank: :empty cannot say it,
       because a widget leaves an empty container behind and the selector
       counts that as content.

       Vertically it is exactly the viewport; only the horizontal overflows.
       The scroll is the browser's own, so the swipe carries its momentum
       and rubber-banding on both platforms and nothing here handles a
       gesture. The borders already on the side panels are the lines
       between them. (C-27) */
    @media (max-width: 45em) {
      main { max-width: none; padding: 0.5em; gap: 0.5em; }
      .content-row { overflow-x: auto; overflow-y: hidden;
                     -webkit-overflow-scrolling: touch; }
      /* Alone, a panel takes the whole width. */
      .content-row > aside.side-panel,
      .content-row > .center-column { flex: 0 0 100%; width: auto; }
      /* Two or three: each is a share of the screen, so the row runs
         wider than the phone and scrolls. A side panel shows most of
         itself with the edge of its neighbour beside it; the centre
         column, which carries the list, takes the screen. Every width
         here is a percentage of the viewport, so it is the same
         arrangement on any handset. */
      .content-row:has(> aside.side-panel:not(.ch-blank)) > aside.side-panel {
        flex: 0 0 auto; width: 85vw;
      }
      .content-row:has(> aside.side-panel:not(.ch-blank)) > .center-column {
        flex: 0 0 auto; width: 100vw;
      }
      .content-row > aside.side-panel.ch-blank { display: none; }
      /* A panel that has been moved to takes the vertical space the
         chrome around it was using. The prompt stays: a person who has
         just moved to a panel is the person about to type. */
      body.ch-panel-focus main { padding: 0; gap: 0; }
      body.ch-panel-focus .chat-label { display: none; }
      /* Asking for a panel is asking to read it, so it takes the screen.
         Browsing sizes a column by its content and lets the row run wider
         than the phone; choosing one ends that -- a panel wider than the
         screen it was just brought to is not the panel, it is the left
         part of it. */
      body.ch-panel-focus .content-row > aside.side-panel,
      body.ch-panel-focus .content-row > .center-column {
        flex: 0 0 100%; width: auto;
      }
    }

    #frame_UserMessage         { flex: 0 0 auto; background: var(--surface); border-top: 0.0625em solid #e5e7eb; }
    #frame_UserPromptAndControl{ flex: 0 0 auto; background: var(--surface); border-top: 0.0625em solid #e5e7eb; }
    /* The popup window. It is markup here, not built in JavaScript: the
       MainWindow iframe is a 1x1 offscreen host for the React widgets, so a
       window rendered inside it has no viewport and cannot be seen or
       clicked. The chrome is a static frame in this page; React authors
       what goes in it and ClientRouter carries the bytes across, which is
       couriering rather than authoring. Empty means closed. */
    /* Printing the session. Declared here rather than built in JavaScript:
       a printable page assembled from a string is display authoring, and a
       stylesheet is the browser's own way to say what a page looks like on
       paper. The session window prints; everything else does not. Controls
       inside it are chrome and carry data-print-omit. */
    @media print {
      body.ch-printing-session > *          { display: none !important; }
      body.ch-printing-session #frame_SessionInfoPopUp {
        display: block !important; position: static !important;
        max-width: none; max-height: none; overflow: visible;
        border: none; box-shadow: none; padding: 0;
      }
      body.ch-printing-session [data-print-omit] { display: none !important; }
      body.ch-printing-session [style*="max-height"] {
        max-height: none !important; overflow: visible !important;
      }
    }
    .ch-popup:empty { display: none; }
    /* Where each window sits. One popup opens another -- About offers
       Session Info -- so they are declared side by side rather than stacked
       on one centre, which is what put the second on top of the first. */
    /* Every window opens centred. They may land on one another; the person
       moves the one they want by dragging its header. */
    .ch-popup {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      min-width: 28em; max-width: min(60em, 92vw); max-height: 80vh;
      /* The window scrolls. Without this the session ran past the bottom
         of the screen and read as truncated content rather than a window
         too small for it. */
      overflow-y: auto; overflow-x: hidden;
      z-index: 1000; background: #fff;
      border: 0.25em solid #0b7a75;
      box-shadow: 0 0.5em 2em rgba(0,0,0,0.25);
      border-radius: 0.5em; padding: 1em;
    }
    .ch-popup.ch-moved { transform: none; }
    .ch-popup-drag {
      cursor: move; user-select: none;
      margin: -1em -1em 0.5em -1em; padding: 0.5em 2.5em 0.5em 1em;
      background: #f0fffe; border-bottom: 0.125em solid #d1fae5;
      border-radius: 0.25em 0.25em 0 0;
    }
    .ch-popup-close {
      position: absolute; top: 0.25em; right: 0.5em;
      font-size: 1.75em; line-height: 1; font-weight: 700;
      color: #0b7a75; text-decoration: none; cursor: pointer;
      padding: 0.1em 0.4em; border-radius: 0.3em;
    }
    footer#frame_Footer {
      height: 4%;
      background: var(--surface);
      border-top: 0.125em solid var(--border);
      flex: 0 0 auto;
    }
    .ch-react-iframe {
      position: absolute; left: -200vw; top: -200vh;
      width: 1vmin; height: 1vmin; border: 0; visibility: hidden;
    }
  </style>
</head>
<body>

  <header id="frame_Header"></header>

  <main>
    <span class="chat-label">Chat with Find Care AI</span>
    <div class="content-row">
      <aside id="frame_LeftPanel" class="side-panel"></aside>
      <div class="center-column">
        <div id="frame_MainWindow"></div>
        <div id="frame_UserMessage"></div>
        <div id="frame_UserPromptAndControl"></div>
      </div>
      <aside id="frame_RightPanel" class="side-panel"></aside>
    </div>
  </main>

  <div id="frame_AboutChatHealtyPopUP" class="ch-popup"></div>
  <div id="frame_SessionInfoPopUp" class="ch-popup"></div>
  <div id="frame_MobileNavDrawer" class="ch-popup"></div>
  <!-- The narrowings. On a phone they are a button and this window
       rather than a block beneath the results, so the vertical space
       goes back to the list and the selector. (C-27) -->
  <div id="frame_NarrowPopUp" class="ch-popup"></div>
  <div id="frame_LegalPanel" class="ch-popup"></div>
  <footer id="frame_Footer"></footer>

  <!-- React widget host. ClientRouter posts router:event-broadcast back via
       iframe[data-frame="MainWindow"]. -->
  <iframe id="coreReactFrame"
          data-frame="MainWindow"
          class="ch-react-iframe"
          title="ChatHealthy widget host"
          allow="microphone; clipboard-write"></iframe>

  <script src="/build.js"></script>
  <script src="/ClientRouter.js"></script>
  <script>
    // Popup-window early exit. The OAuth callback redirects the popup
    // back to the wrapper origin with ?oauth_popup_close=1; we close the
    // window immediately without painting any UI. Window management is
    // not display logic — no HTML is constructed here.
    (function () {
      var params = new URLSearchParams(window.location.search);
      window._popupParams = Object.fromEntries(params);
      if (params.get('oauth_popup_close') === '1') {
        window.close();
        return;
      }
    })();

    (function () {
      var SS = '__HF_URL_SHAREDSERVICES__';
      window._envServiceUrls = { sharedservices: SS, findcare: '', evaluatecare: '' };
      // Bootstrap call: peer_urls is a /gate op that returns one complete
      // JSON payload. Routed through ClientRouter.getFullPayload so every
      // server call — bootstrap included — goes through the one canonical
      // client-side gateway (FrontEndArchitecture deck contract).
      // credentials:'include' is wired inside getFullPayload.
      window.ClientRouter.getFullPayload({ op: 'peer_urls', payload: {} })
        .then(function (d) {
          window._envServiceUrls.findcare     = (d && d.findcare)     || '';
          window._envServiceUrls.evaluatecare = (d && d.evaluatecare) || '';
          var iframe = document.getElementById('coreReactFrame');
          if (iframe) {
            // Forward popup URL params (e.g. the OAuth state/flow) to the
            // React iframe once it loads. Parameter passing only —
            // the React widget produces all display.
            iframe.addEventListener('load', function () {
              if (!window._popupParams || !iframe.contentWindow) return;
              // The React app inside the iframe registers its message
              // listener inside a useEffect, which fires AFTER the
              // iframe's load event. Retry on a short cadence so the
              // first message after React mounts isn't lost. ~2 s of
              // retries handles the mount window; the widget treats
              // duplicate messages as idempotent.
              var tries = 0;
              var send = function () {
                if (iframe.contentWindow) {
                  // Include the SharedServices origin so widgets in the
                  // iframe can post back to SS without relying on the
                  // wrapper's _envServiceUrls (which is not visible
                  // cross-origin).
                  iframe.contentWindow.postMessage(
                    {
                      type: 'popup_params',
                      params: window._popupParams,
                      env: {
                        sharedservices: (window._envServiceUrls && window._envServiceUrls.sharedservices) || '',
                      },
                    },
                    '*'
                  );
                }
              };
              send();
              var t = setInterval(function () {
                send();
                if (++tries >= 20) clearInterval(t);
              }, 100);
            });
            // The React application is served by this site, not by the
            // FindCare Space. The Space's address is no longer a browser
            // address at all: every route on it requires a SharedServices
            // signature, and a bundle route could not.
            iframe.src = '/app/';
          }
          // Mint a signed SessionToken before any non-trivial /gate call
          // fires. /gate validates the token on every non-trivial op, so
          // ClientRouter must hold one before any non-trivial /gate
          // call. /auth/issue
          // is un-authenticated (pre-auth by design); every subsequent
          // /gate call is validated using the token this returns.
          //
          // One call establishes the session. Without it the user_object
          // would be minted lazily on the first gesture and a visitor who
          // lands and just looks would be invisible to SharedServices —
          // no session row, no identity in the banner. /auth/issue makes
          // the session and returns its token; ClientRouter holds that
          // token and threads it on every subsequent call.
          if (window.ClientRouter && typeof window.ClientRouter.bootstrap === 'function') {
            window.ClientRouter.bootstrap()
              .catch(function () {
                window.location.replace('/bootstrap-error.html');
              });
          }
        })
        .catch(function (_err) {
          // Bootstrap is the spine of the page — without peer_urls,
          // React cannot mount and nothing renders. Per Rule-009 this
          // file authors no display content; redirect to the static
          // bootstrap-error.html instead. The underlying error is
          // visible in this browser's developer-tools Network panel.
          window.location.replace('/bootstrap-error.html');
        });
    })();
  </script>
</body>
</html>
